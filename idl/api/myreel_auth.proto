syntax = "proto3";

package myreel.auth;

option go_package = "/api/auth";

import "api.proto";

message LoginRequest {
  string identity      = 1[(api.body)="identity"];
  string password      = 2[(api.body)="password"];
  int64  identity_type = 3[(api.body)="identity_type"];
}

message LoginResponse {}

// auth service
service AuthService {
    // user login
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (api.post)="/api/v1/auth/login";
  }
}